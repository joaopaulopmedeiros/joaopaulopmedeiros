<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="280" viewBox="0 0 1200 280" role="img" aria-label="João Paulo Medeiros — Software Engineer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#161b22"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7c3aed"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#30363d" stroke-width="1" opacity="0.45"/>
    </pattern>
    <radialGradient id="glow" cx="0.85" cy="0.2" r="0.6">
      <stop offset="0" stop-color="#7c3aed" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="280" rx="16" fill="url(#bg)"/>
  <rect width="1200" height="280" rx="16" fill="url(#grid)"/>
  <rect width="1200" height="280" rx="16" fill="url(#glow)"/>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="72" y="122" fill="#8b949e" font-size="20" letter-spacing="4">SOFTWARE ENGINEER</text>
    <text x="72" y="182" fill="#f0f6fc" font-size="56" font-weight="700">João Paulo Medeiros</text>
    <rect x="72" y="204" width="96" height="4" rx="2" fill="url(#accent)"/>
  </g>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" fill="#8b949e">
    <rect x="828" y="72" width="300" height="136" rx="10" fill="#0d1117" stroke="#30363d"/>
    <circle cx="852" cy="94" r="5" fill="#ff5f57"/>
    <circle cx="870" cy="94" r="5" fill="#febc2e"/>
    <circle cx="888" cy="94" r="5" fill="#28c840"/>
    <text x="852" y="132"><tspan fill="#22d3ee">$</tspan> whoami</text>
    <text x="852" y="158" fill="#c9d1d9">Engineer @ Stone</text>
    <text x="852" y="184" fill="#c9d1d9">Natal/RN · Brazil</text>
  </g>
</svg>
